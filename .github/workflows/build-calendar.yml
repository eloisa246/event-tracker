# Rebuild the calendar on a schedule and commit the output.
#
# Compliance notes live in docs/COMPLIANCE.md. The short version of why this
# file looks the way it does:
#
#   * GitHub's Additional Product Terms restrict GitHub-hosted runners to work
#     related to "the production, testing, deployment, or publication of the
#     software project" in the repo, and separately prohibit activity that puts
#     a disproportionate burden on the service. This repo *is* the pipeline and
#     the calendar is its published output, so the run is on-purpose -- but the
#     cadence, the timeout and the concurrency guard below are what keep it
#     visibly modest rather than merely arguable.
#   * Every knob here is set to bound cost, not to maximise freshness.
name: Build calendar

on:
  schedule:
    # Every 6h. Deliberately not on the hour: the top of the hour is GitHub's
    # busiest scheduling slot and runs there get delayed or dropped.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege: the job writes commits to this repo and needs nothing else.
permissions:
  contents: write

# Never let two builds scrape the same venues at once. Queue rather than
# cancel, so a slow run still finishes and commits its results.
concurrency:
  group: build-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung browser render is the realistic way this job burns hours of runner
    # time for nothing. Bound it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Build
        run: python scripts/build_calendar.py

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json public/*.ics docs/health.md
          # Nothing changed is the normal case for a quiet window, not a failure.
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update calendar ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
