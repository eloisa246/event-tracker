# Example source configuration.
#
# This file is illustrative — the real config/sources.yaml is generated by the
# Phase 0 discovery pass from whatever you drop in inbox/, then hand-corrected.
#
# The point of this format: adding or fixing a venue is a config edit, not a code
# change. Every tier below is handled by shared adapters; nothing here implies a
# bespoke Python module.

defaults:
  timezone: America/New_York
  window_days: 180          # how far ahead to expand/collect
  user_agent: "brooklyn-event-calendar (+https://github.com/9dpzmbpyym-crypto/Event-Calender)"
  rate_limit:
    per_host_delay_seconds: 2
    max_concurrency: 4

sources:

  # ── Tier 0: native iCal feed. Best case. Nothing to break. ────────────────
  - id: example-library
    name: Example Branch Library
    strategy: ical
    url: https://example.org/events.ics
    neighborhood: Bed-Stuy
    categories: [community, books]

  # ── Tier 0: embedded Google Calendar, resolved to its public ICS ──────────
  - id: example-mutual-aid
    name: Example Mutual Aid
    strategy: google_calendar
    calendar_id: abc123def456@group.calendar.google.com
    neighborhood: Bushwick
    categories: [community]

  # ── Tier 1: The Events Calendar (WordPress). One adapter, many venues. ────
  - id: example-gallery
    name: Example Gallery
    strategy: tribe_events
    base_url: https://examplegallery.com
    neighborhood: Greenpoint
    categories: [art]

  # ── Tier 1: Eventbrite organizer page ─────────────────────────────────────
  - id: example-workshop-org
    name: Example Workshop Org
    strategy: eventbrite_organizer
    organizer_url: https://www.eventbrite.com/o/example-12345678
    categories: [community, workshops]

  # ── Tier 1: lu.ma calendar ────────────────────────────────────────────────
  - id: example-reading-series
    name: Example Reading Series
    strategy: luma
    calendar_slug: example-reading-series
    categories: [books]

  # ── Tier 1.5: Instagram-only, resolved via bio link to a real feed ────────
  # Discovery records how we got here so it can be re-checked if the link moves.
  - id: example-diy-space
    name: Example DIY Space
    strategy: dice
    venue_url: https://dice.fm/venue/example
    discovered_via:
      instagram: "@exampledIY"
      bio_link: https://linktr.ee/exampledIY
    categories: [music]

  # ── Tier 2: generic schema.org JSON-LD scrape ─────────────────────────────
  - id: example-bookstore
    name: Example Bookstore
    strategy: jsonld
    url: https://examplebooks.com/events
    neighborhood: Carroll Gardens
    categories: [books]

  # ── Tier 3: declarative CSS scraper. Config, not code. ────────────────────
  # "@attr" suffix reads an attribute instead of text.
  - id: example-bar
    name: Example Bar
    strategy: css
    url: https://examplebar.com/calendar
    selectors:
      item:  ".event-listing"
      title: "h3.event-title"
      date:  ".event-date@datetime"
      time:  ".event-time"
      url:   "a.event-link@href"
      image: "img.event-img@src"
    date_format: auto        # dateparser handles most; pin a format if ambiguous
    neighborhood: Ridgewood
    categories: [music, food]

  # ── Tier 4: JS-rendered, LLM-assisted extraction. Expensive — use sparingly.
  # Only re-invokes the model when the rendered content hash changes.
  - id: example-club
    name: Example Club
    strategy: llm_extract
    url: https://exampleclub.com/whats-on
    render: true             # Playwright
    cache_on: content_hash
    categories: [music]
    confidence: low          # flagged in output; surfaces in the review queue

  # ── Tier 5: no machine-readable source. Hand-entered. ─────────────────────
  - id: example-storefront
    name: Example Storefront
    strategy: manual
    file: inbox/manual-events.md
    note: "IG stories only — bio link goes nowhere. Check quarterly for a feed."
    categories: [art]

# Sources that were checked and deliberately excluded, so discovery doesn't
# keep re-proposing them.
excluded:
  - id: example-closed-venue
    reason: "Permanently closed as of 2026-03."
