# Hand-entered events.
#
# For everything that will never be machine-readable -- a collective's collage
# night, a reading group in a back room, anything that lives only as a flyer.
# These flow into calendar.ics exactly like scraped events do.
#
# ---------------------------------------------------------------------------
# HOW TO ADD ONE
#
#   - title: Collage Night              <- required
#     org: Nana's House                 <- who's putting it on
#     start: 2026-08-11 19:00           <- required. 24-hour clock, New York time
#     end: 2026-08-11 21:00             <- optional
#     location: Nana's House            <- optional, address is better
#     url: https://...                  <- optional, where to find out more
#     description: Free, materials provided.       <- optional
#     category: Creative Collectives & Communities <- optional, see list below
#
# Keep the two leading spaces and the "- " before title. Everything else lines
# up underneath it. If a date is wrong or a title is missing, that ONE event is
# skipped and named in docs/health.md -- the rest of the calendar still builds.
#
# Times are New York time. Don't do any UTC conversion yourself.
#
# Categories (use one of these so the per-category feeds work):
#   Arts, Music & Creative Classes
#   Bars & Third Places
#   Creative Collectives & Communities
#   Events Boards & Bulletins
#   Literary & Book Communities
#   Music Venues & Education
# ---------------------------------------------------------------------------

