# Sources the calendar builds from.
#
# Generated by scripts/make_sources.py from data/discovery.json, then
# corrected by hand. Discovery guesses; this file is the decision.
#
# 19 sources active, 15 still need work (listed commented out at the bottom).

#
# Hand corrections applied on top of the generated config:
#   - Abrons Arts Center: strategy=jsonld, feed_url=https://www.abronsartscenter.org/calendar
#   - Film Noir Cinema: strategy=jsonld, feed_url=https://www.filmnoircinema.com/program/
#   - dropped Queer Book Club Bushwick: covered by Hive Mind Books (same Eventbrite)

#
# Rerouted because the original platform refuses automated access:
#   - Market Hotel: now bandsintown via https://www.bandsintown.com/v/10014579
#   - Nowadays: now bandsintown via https://www.bandsintown.com/v/10014974
#   - Baby's All Right: now bandsintown via https://www.bandsintown.com/v/10001849
#   - Caffeine Underground: now jsonld via https://shotgun.live/en/venues/caffeine-underground
#   - parked Starr Bar: RA returns 403 and its own site exposes only per-event iCal


#
#   - parked Nowadays: Bandsintown API and RA both return 403; own site is WordPress with no feed
#   - parked Caffeine Underground: Shotgun returned 429; RA returns 403

#
#   - parked Brooklyn Flea: recurring weekly market, not discrete events
#   - parked Scratch Ceramics Studio: multi-week class blocks, not single events



#
#   - grand-bazaar-nyc: switched to tribe_events. Its page carries the
#     WordPress class post-type-archive-events, confirmed via manual
#     diagnostic capture as The Events Calendar plugin's own markup.


#
#   - parked Grand Bazaar NYC: confirmed via /wp-json/ namespace list
#     (contact-form-7, mc4wp, wpforms, wp/v2 -- no events plugin) that
#     there is no REST API for events on this WordPress site. Runs a
#     recurring weekly market rather than discrete events anyway.

#
#   - ridgewood-commons: found via mobile emulation + reading the
#     FullCalendar init code directly. Real iCal feed, no browser needed.

#
#   - parked Abrons Arts Center: Sanity CMS-backed calendar. Diagnostics
#     found no network JSON and no embedded <script> JSON under two
#     separate checks -- data likely fetched via a request shape this
#     tool doesn't capture (e.g. a GraphQL POST). No concrete lead yet.

#
#   - baby-s-all-right: switched to its Eventim white-label ticketing page
#   - grand-bazaar-nyc: un-parked. REST API confirmed absent, but the
#     "Add to Calendar" button on real event pages is a front-end
#     theme feature (classic ?ical=1 export), independent of REST.



#
#   - parked Baby's All Right: Eventim page shows a genuine Cloudflare
#     bot challenge ('Just a moment...', challenges.cloudflare.com) to
#     our identified crawler. This is a real access control, respected
#     rather than worked around.

#
#   - parked Grand Bazaar NYC (again): AddEvent widget confirmed real,
#     but its markup lives on individual event pages
#     (e.g. /events/<slug>/), not the /events/ archive that was
#     diagnosed. The archive only loads the widget's library, no
#     button. Worth revisiting by diagnosing a specific event page
#     directly rather than the listing.

#
#   - grand-bazaar-nyc: un-parked. Its events live in AddEvent widget
#     child spans on each event page. Pointed at the archive so the
#     detail-page follower reaches all of them.



